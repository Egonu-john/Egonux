name: EGONUX OS quality gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: egonux-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Java for Firebase emulators
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install locked dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Test Firestore authorization rules
        run: npm run test:rules

      - name: Test TIRP integrity, release policy and recovery validation
        run: npm run test:tirp

      - name: Build production bundle
        run: npm run build

      - name: Smoke-test public routes and anonymous API denial
        run: npm run test:smoke

  attest-source:
    name: Attest source snapshot after full quality gate
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Check out exact validated commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Create source archive for the validated commit
        run: git archive --format=tar.gz --output=egonux-source-${GITHUB_SHA}.tar.gz "${GITHUB_SHA}"

      - name: Generate GitHub artifact attestation
        uses: actions/attest@v4
        with:
          subject-path: egonux-source-${{ github.sha }}.tar.gz
