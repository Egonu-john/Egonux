name: EGONUX ANOSA Continuous Integration & Release Gates

on:
  push:
    branches: [ main, feature/* ]
  pull_request:
    branches: [ main ]

jobs:
  verify-build-and-security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Execute Type Safety & Lint Verification
        run: npm run lint

      - name: Execute Chapter 8 Identity & Security Harness
        run: npm run test:ch8

      - name: Execute Chapter 9 Launch & Governance Harness
        run: npm run test:ch9

      - name: Verify Build Output
        run: npm run build
