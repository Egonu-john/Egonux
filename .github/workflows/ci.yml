name: EGONUX ANOSA Continuous Integration & Release Gates

on:
  push:
    branches: [main, "feature/*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-build-and-security:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install Locked Dependencies
        run: npm ci

      - name: Execute Lint Verification
        run: npm run lint

      - name: Execute TypeScript Verification
        run: npm run typecheck

      - name: Lint Shared Button System and Migrated Screens
        run: >-
          npx eslint
          components/ui/EgonuxButton.tsx
          components/ui/EgonuxActionLink.tsx
          components/Header.tsx
          components/Hero.tsx
          pages/design-system/buttons.tsx
          components/os/ActionModal.tsx
          components/os/AppShell.tsx
          components/wallet/WalletLedgerView.tsx
          components/os/DashboardView.tsx
          components/os/UserModuleViews.tsx
          components/os/EnterpriseViews.tsx
          components/anosa/AnosaMobile.tsx
          components/anosa/EvidenceReviewPanel.tsx
          pages/login.tsx
          pages/api/auth/test-rbac.ts

      - name: Verify Shared EGONUX Button System
        run: npm run test:buttons

      - name: Execute Chapter 8 Identity & Security Harness
        run: npm run test:ch8

      - name: Execute Chapter 9 Launch & Governance Harness
        run: npm run test:ch9

      - name: Verify Production Build
        run: npm run build

      - name: Verify Route Smoke Tests
        run: npm run test:smoke
